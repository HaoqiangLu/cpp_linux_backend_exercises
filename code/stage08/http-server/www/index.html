<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高性能 HTTP 服务器</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
               max-width: 720px; margin: 60px auto; padding: 0 20px; color: #24292f; }
        h1 { border-bottom: 2px solid #d0d7de; padding-bottom: 8px; }
        code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; }
        ul { line-height: 1.9; }
    </style>
</head>
<body>
    <h1>It works! 🎉</h1>
    <p>这是基于多线程 Reactor 模型的 HTTP/1.1 服务器默认首页。</p>
    <p>如果你能看到本页面，说明 <code>Acceptor → sub-EventLoop → ThreadPool → HttpHandler</code> 全链路已跑通。</p>
    <h2>特性</h2>
    <ul>
        <li>主从 Reactor + 线程池架构</li>
        <li>支持 GET / HEAD / POST / OPTIONS</li>
        <li>HTTP/1.1 长连接（Keep-Alive）</li>
        <li>最小堆定时器处理空闲超时连接</li>
        <li>优雅退出（SIGTERM / SIGINT）</li>
    </ul>
</body>
</html>
